name = "pact-ingest"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9deab2b981096c5b012feb4a52546fe6"

[[queues.producers]]
queue = "pact-reports"
binding = "REPORT_QUEUE"

[[queues.consumers]]
queue = "pact-reports"
max_batch_size = 1
max_retries = 3

[[d1_databases]]
binding = "DB"
database_name = "pact-ledger"
database_id = "bf7ad6b2-e01c-479f-b417-bab9d468db8a"

[[routes]]
pattern = "ledger.webuildreal.dev"
custom_domain = true

[vars]
ENVIRONMENT = "production"
CHAIN_RPC_URL = "https://sepolia.base.org"

# Secrets (wrangler secret put):
#   PUBLISHER_PRIVATE_KEY  — PactRoots owner (Signet deployer)
#   LEDGER_WRITE_SECRET    — Bearer token for POST /v1/domains

# After deploy: Cloudflare Email Routing → rua@pact.webuildreal.dev → Send to Worker → pact-ingest
# Email handler tries RFC 6376, then DKIM-Signature / envelope, stores wrapper + DKIM TXT
# snapshot (content-addressed by keccak256), queues hash + d=/s=. RFC822 is not put on the queue.
# Legacy intake that still reaches the Worker: rua@pact.pbm-labs.com
# rua@webuildreal.dev does not — apex MX is Proton.
